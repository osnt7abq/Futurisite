<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuturiVideo // AI YouTube Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=JetBrains+Mono&display=swap');
        body { background: #050505; color: #fff; font-family: 'Space Grotesk', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255,255,255,0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-glow { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
        .progress-bar { width: 0%; transition: width 0.5s ease; }
    </style>
</head>
<body class="p-4 md:p-10">

    <!-- Header -->
    <nav class="flex justify-between items-center mb-12">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center neon-glow">
                <i class="fa-solid fa-play text-white"></i>
            </div>
            <span class="text-2xl font-bold tracking-tighter uppercase">FuturiVideo</span>
        </div>
        <div class="mono text-[10px] text-indigo-400 bg-indigo-400/10 px-3 py-1 rounded-full">SERVER: ACTIVE (GPU_NODE_01)</div>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- LEFT: PROMPT PANEL -->
        <div class="lg:col-span-2 space-y-6">
            <div class="glass p-8 rounded-[32px]">
                <h2 class="text-xl font-bold mb-4">YouTube Video Prompt</h2>
                <textarea id="promptInput" placeholder="Describe the video you want (e.g., 'A 10-minute documentary about the hidden history of Rome')..." class="w-full h-40 bg-white/5 border border-white/10 rounded-2xl p-6 outline-none focus:border-indigo-500 transition text-lg"></textarea>
                
                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 block mb-2">Duration</label>
                        <select class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none">
                            <option>5 Minutes</option>
                            <option>10 Minutes</option>
                            <option>20 Minutes</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 block mb-2">AI Voice</label>
                        <select class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none">
                            <option>Deep Narrative (Male)</option>
                            <option>Soft Storyteller (Female)</option>
                            <option>Futuristic AI</option>
                        </select>
                    </div>
                </div>

                <button onclick="startGeneration()" class="w-full mt-8 bg-indigo-600 hover:bg-indigo-500 py-5 rounded-2xl font-bold text-xl transition transform active:scale-95 shadow-xl shadow-indigo-500/20">
                    Generate Full Video
                </button>
            </div>
        </div>

        <!-- RIGHT: AGENT STATUS TERMINAL -->
        <div class="space-y-6">
            <div class="glass p-6 rounded-[32px] h-full flex flex-col">
                <h3 class="mono text-xs text-gray-500 mb-4 uppercase tracking-widest">Agent_Log // System_Output</h3>
                <div id="terminal" class="mono text-[11px] space-y-2 flex-grow overflow-y-auto text-indigo-300">
                    <p>> Ready for input...</p>
                </div>
                
                <div class="mt-6 pt-6 border-t border-white/10">
                    <div class="flex justify-between text-[10px] mb-2 uppercase">
                        <span>Total Progress</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-indigo-500 progress-bar"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- PREVIEW AREA (The "Result") -->
    <section id="previewArea" class="mt-12 hidden">
        <div class="glass p-2 rounded-[40px] overflow-hidden aspect-video relative">
            <div class="absolute inset-0 flex items-center justify-center bg-black/60 z-10" id="videoLoading">
                <div class="text-center">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500 mb-4"></i>
                    <p class="mono text-xs uppercase">Rendering 4K Frames...</p>
                </div>
            </div>
            <!-- Video Placeholder -->
            <div class="w-full h-full bg-[#111] flex items-center justify-center">
                <i class="fa-solid fa-clapperboard text-8xl opacity-10"></i>
            </div>
        </div>
    </section>

    <script>
        function startGeneration() {
            const prompt = document.getElementById('promptInput').value;
            if(!prompt) return alert("Please enter a prompt!");

            document.getElementById('previewArea').classList.remove('hidden');
            const terminal = document.getElementById('terminal');
            const bar = document.getElementById('progressBar');
            const text = document.getElementById('progressText');

            const steps = [
                { msg: "> Initializing Video Agent...", p: 10 },
                { msg: "> Writing 10-minute script...", p: 25 },
                { msg: "> Script complete. Generating ElevenLabs voiceover...", p: 40 },
                { msg: "> Creating AI Visuals (Runway Gen-3)...", p: 60 },
                { msg: "> Stitching 450 clips into timeline...", p: 85 },
                { msg: "> Finalizing 4K Render...", p: 95 },
                { msg: "> SUCCESS: Video Ready for YouTube.", p: 100 }
            ];

            let i = 0;
            const interval = setInterval(() => {
                if(i < steps.length) {
                    const p = document.createElement('p');
                    p.textContent = steps[i].msg;
                    terminal.appendChild(p);
                    bar.style.width = steps[i].p + "%";
                    text.textContent = steps[i].p + "%";
                    i++;
                } else {
                    clearInterval(interval);
                    document.getElementById('videoLoading').innerHTML = `
    <a href="https://www.w3schools.com/html/mov_bbb.mp4" download="AI_Video.mp4" 
       class="bg-white text-black px-12 py-4 rounded-full font-bold uppercase text-xs shadow-xl">
       Download MP4
    </a>
`;
                }
            }, 2500);
        }
    </script>
</body>
</html>
