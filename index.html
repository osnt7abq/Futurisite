<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuturiVideo // Real-Time AI Production</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,900&family=Inter:wght@300;400;800&family=JetBrains+Mono&display=swap');
        body { background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .gold-text { background: linear-gradient(135deg, #D4AF37 0%, #FFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="p-6 md:p-12">

    <nav class="fixed top-0 left-0 w-full z-50 glass px-8 py-4 flex justify-between items-center">
        <div class="text-xl font-black gold-text italic tracking-tighter">FUTURIVIDEO.PRO</div>
        <div id="clock" class="mono text-sm opacity-50">00:00:00</div>
    </nav>

    <main class="mt-20 max-w-4xl mx-auto space-y-8">
        <div class="glass p-10 rounded-[40px] border-indigo-500/20">
            <h1 class="text-4xl font-black mb-2 uppercase">AI Video Generator</h1>
            <p class="text-gray-500 text-sm mb-8">Connected to Shotstack v2026 Engine</p>

            <textarea id="promptInput" placeholder="Describe your YouTube video..." 
                class="w-full h-40 bg-white/5 border border-white/10 rounded-3xl p-6 outline-none focus:border-indigo-500 transition mb-6"></textarea>

            <button onclick="generateRealVideo()" id="genBtn" class="w-full bg-white text-black py-6 rounded-3xl font-black uppercase tracking-widest hover:bg-indigo-600 hover:text-white transition shadow-2xl">
                Generate & Render Video
            </button>
        </div>

        <!-- LIVE AGENT STATUS -->
        <div class="glass p-8 rounded-[40px] min-h-[300px]">
            <h3 class="mono text-[10px] text-gray-500 uppercase mb-4 tracking-[0.3em]">System
