<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuturiVideo V9 // Global Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;800&family=JetBrains+Mono&display=swap');
        body { background: #030303; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255,255,255,0.02); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); }
        .gold-text { background: linear-gradient(135deg, #D4AF37 0%, #FFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-indigo { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); transition: 0.4s; }
        .btn-indigo:hover { box-shadow: 0 0 30px rgba(99, 102, 241, 0.4); transform: scale(1.02); }
        .thumbnail-box { aspect-ratio: 16/9; background: #111; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="p-4 md:p-10 pb-40">

    <!-- NAV -->
    <nav class="fixed top-0 left-0 w-full z-50 glass px-8 py-5 flex justify-between items-center border-b border-white/5">
        <div class="flex flex-col">
            <span class="text-xl font-black italic gold-text uppercase">FuturiVideo V9</span>
            <span class="text-[8px] tracking-[0.5em] opacity-40 uppercase text-indigo-400">Global Distribution Hub</span>
        </div>
        <div id="clock" class="mono text-xs opacity-30">00:00:00</div>
    </nav>

    <!-- MAIN INTERFACE -->
    <main class="mt-24 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- SETTINGS PANEL (3 Cols) -->
        <div class="lg:col-span-3 space-y-6">
            <div class="glass p-6 rounded-[32px]">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-4">1. Global Voice</h3>
                <select id="voiceLang" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs outline-none focus:border-indigo-500 mb-6">
                    <option value="Christopher">English (Male - Professional)</option>
                    <option value="Hayley">English (Female - Narrative)</option>
                    <option value="Enrique">Spanish (Male)</option>
                    <option value="Remi">French (Male)</option>
                </select>

                <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-4">2. Distribution Target</h3>
                <div class="grid grid-cols-3 gap-2 mb-6">
                    <button class="bg-white/5 p-2 rounded-lg text-lg hover:bg-red-600/20 transition"><i class="fa-brands fa-youtube"></i></button>
                    <button class="bg-white/5 p-2 rounded-lg text-lg hover:bg-pink-600/20 transition"><i class="fa-brands fa-tiktok"></i></button>
                    <button class="bg-white/5 p-2 rounded-lg text-lg hover:bg-blue-600/20 transition"><i class="fa-brands fa-instagram"></i></button>
                </div>

                <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-4">3. Branding</h3>
                <input id="brandName" type="text" placeholder="@ChannelHandle" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-xs outline-none">
            </div>
        </div>

        <!-- EDITOR (6 Cols) -->
        <div class="lg:col-span-6 space-y-6">
            <div class="glass p-8 rounded-[40px] border-indigo-500/20">
                <textarea id="promptInput" placeholder="Describe the world-changing story you want to tell..." 
                    class="w-full h-96 bg-white/5 border border-white/10 rounded-3xl p-8 outline-none focus:border-indigo-500 transition text-white text-sm leading-relaxed"></textarea>
                
                <button onclick="deployGlobalProduction()" id="genBtn" class="w-full mt-6 btn-indigo text-white py-6 rounded-3xl font-black uppercase tracking-[0.3em] text-xs shadow-2xl">
                    Deploy Global Production
                </button>
            </div>
        </div>

        <!-- TERMINAL (3 Cols) -->
        <div class="lg:col-span-3">
            <div class="glass p-8 rounded-[40px] h-full flex flex-col min-h-[500px]">
                <h3 class="mono text-[9px] text-gray-600 uppercase mb-6 tracking-widest">Global_Node_Monitor</h3>
                <div id="terminal" class="mono text-[10px] space-y-3 flex-grow overflow-y-auto text-indigo-300">
                    <p class="opacity-30">> System Online. Ready.</p>
                </div>
                <div class="mt-8 pt-4 border-t border-white/10">
                    <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-indigo-500 progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- AI THUMBNAIL & PLAYER SECTION -->
    <section id="outputSection" class="max-w-7xl mx-auto mt-12 hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Thumbnail Architect -->
        <div class="glass p-8 rounded-[40px]">
            <h3 class="text-xl font-bold mb-6 italic">AI Thumbnail Architect</h3>
            <div id="thumbnailContainer" class="thumbnail-box flex items-center justify-center relative">
                <i class="fa-solid fa-palette text-4xl opacity-10"></i>
                <img id="thumbImg" class="hidden w-full h-full object-cover">
                <div class="absolute bottom-4 left-4 glass px-4 py-2 rounded-full text-[10px] font-bold uppercase">Click-Ready</div>
            </div>
            <button class="w-full mt-4 bg-white/5 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition">Regenerate Thumbnail</button>
        </div>

        <!-- Video Player -->
        <div class="glass p-8 rounded-[40px]">
            <h3 class="text-xl font-bold mb-6 italic">Masterpiece Preview</h3>
            <div id="videoContainer" class="thumbnail-box flex items-center justify-center bg-black">
                <div id="loadingUI" class="text-center">
                    <i class="fa-solid fa-earth-americas fa-spin text-3xl text-indigo-500 mb-4"></i>
                    <p class="mono text-[9px] uppercase tracking-widest opacity-40">Rendering Global Feed...</p>
                </div>
            </div>
            <div id="seoData" class="mt-4 p-4 glass rounded-2xl hidden">
                <div class="text-[9px] text-indigo-400 font-bold uppercase mb-2">Automated SEO</div>
                <div id="seoTitle" class="text-sm font-bold mb-1"></div>
                <div id="hashtags" class="text-xs text-gray-500 italic"></div>
            </div>
        </div>
    </section>

    <script>
        const SHOTSTACK_API_KEY = 'rRayW9YAUmPyZZ9vjPL5iBBcFPB1i6L7HEOZtOyQ'; 

        async function deployGlobalProduction() {
            const script = document.getElementById('promptInput').value;
            const voice = document.getElementById('voiceLang').value;
            if(!script) return alert("Global Node: Script Required.");

            document.getElementById('outputSection').classList.remove('hidden');
            const terminal = document.getElementById('terminal');
            terminal.innerHTML = "<p>> Activating Global Distribution Pipeline...</p>";

            // 1. GENERATE THUMBNAIL (Unsplash AI)
            const keyword = script.split(' ')[0] || "future";
            const thumbImg = document.getElementById('thumbImg');
            thumbImg.src = `https://source.unsplash.com/featured/1280x720/?${keyword},cinematic`;
            thumbImg.classList.remove('hidden');

            // 2. GENERATE SEO
            document.getElementById('seoData').classList.remove('hidden');
            document.getElementById('seoTitle').innerText = "THE TRUTH ABOUT " + keyword.toUpperCase();
            document.getElementById('hashtags').innerText = "#AI #Innovation #Global2026 #" + keyword;

            // 3. SHOTSTACK MULTI-SCENE RENDER
            const sentences = script.match(/[^\.!\?]+[\.!\?]+/g) || [script];
            let currentTime = 0;
            const videoClips = [];
            const voiceClips = [];

            sentences.forEach((text, i) => {
                const duration = 12;
                videoClips.push({
                    "asset": { "type": "image", "src": `https://source.unsplash.com/featured/1280x720/?${keyword},nature` },
                    "start": currentTime, "length": duration, "effect": "zoomIn"
                });
                voiceClips.push({
                    "asset": { "type": "tts", "text": text.trim(), "voice": voice },
                    "start": currentTime
                });
                currentTime += duration;
            });

            try {
                const response = await fetch('https://api.shotstack.io/stage/render', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': SHOTSTACK_API_KEY },
                    body: JSON.stringify({
                        "timeline": {
                            "soundtrack": { "src": "https://s3-ap-southeast-2.amazonaws.com/shotstack-assets/music/uninspired.mp3", "volume": 0.2 },
                            "tracks": [{ "clips": voiceClips }, { "clips": videoClips }]
                        },
                        "output": { "format": "mp4", "resolution": "hd" }
                    })
                });
                const data = await response.json();
                pollStatus(data.response.id);
            } catch (err) { terminal.innerHTML += "<p class='text-red-500'>> Global Node Error.</p>"; }
        }

        async function pollStatus(id) {
            const res = await fetch(`https://api.shotstack.io/stage/render/${id}`, {
                headers: { 'x-api-key': SHOTSTACK_API_KEY }
            });
            const data = await res.json();
            const status = data.response.status;
            document.getElementById('terminal').innerHTML += `<p>> Global Status: ${status}</p>`;

            if (status === 'done') {
                showVideo(data.response.url);
            } else {
                setTimeout(() => pollStatus(id), 5000);
            }
        }

        function showVideo(url) {
            document.getElementById('loadingUI').classList.add('hidden');
            document.getElementById('videoContainer').innerHTML = `<video controls autoplay class="w-full h-full"><source src="${url}" type="video/mp4"></video>`;
        }

        setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
