<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuturiVideo V2 // Visual Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;900&family=JetBrains+Mono&display=swap');
        body { background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .gold-text { background: linear-gradient(135deg, #D4AF37 0%, #FFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .progress-fill { width: 0%; transition: width 0.5s ease; }
    </style>
</head>
<body class="p-6 md:p-12">

    <nav class="fixed top-0 left-0 w-full z-50 glass px-8 py-4 flex justify-between items-center">
        <div class="text-xl font-black italic tracking-tighter gold-text">FUTURIVIDEO V2</div>
        <div id="clock" class="mono text-xs opacity-50">00:00:00</div>
    </nav>

    <main class="mt-20 max-w-4xl mx-auto space-y-8">
        <div class="glass p-10 rounded-[40px]">
            <h1 class="text-4xl font-black mb-2 uppercase">Visual Storyteller</h1>
            <p class="text-gray-500 text-xs mb-8 uppercase tracking-[0.3em]">AI Director // Multi-Scene Rendering</p>

            <textarea id="promptInput" placeholder="Paste your full script or story here..." 
                class="w-full h-60 bg-white/5 border border-white/10 rounded-3xl p-6 outline-none focus:border-indigo-500 transition text-white text-sm leading-relaxed"></textarea>

            <button onclick="generateVisualVideo()" id="genBtn" class="w-full bg-indigo-600 text-white py-6 rounded-3xl font-black uppercase tracking-widest hover:bg-indigo-500 transition shadow-2xl">
                Generate Visual Documentary
            </button>
        </div>

        <div class="glass p-8 rounded-[40px] min-h-[200px]">
            <h3 class="mono text-[10px] text-gray-500 uppercase mb-4 tracking-[0.3em]">Director_Logs</h3>
            <div id="terminal" class="mono text-[11px] space-y-2 text-indigo-300">
                <p>> Agent idle. Awaiting script...</p>
            </div>
            <div class="mt-8">
                <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-full bg-indigo-500 progress-fill"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SHOTSTACK_API_KEY = 'rRayW9YAUmPyZZ9vjPL5iBBcFPB1i6L7HEOZtOyQ'; 

        async function generateVisualVideo() {
            const fullText = document.getElementById('promptInput').value;
            if(!fullText) return alert("Please enter a story or script.");

            const terminal = document.getElementById('terminal');
            const bar = document.getElementById('progressBar');
            
            terminal.innerHTML = "<p>> AI Director Analyzing Script...</p>";
            bar.style.width = "10%";

            // 1. SPLIT TEXT INTO SCENES (By sentences)
            const sentences = fullText.match(/[^\.!\?]+[\.!\?]+/g) || [fullText];
            terminal.innerHTML += `<p>> Detected ${sentences.length} Scenes...</p>`;

            // 2. BUILD THE TIMELINE
            let currentTime = 0;
            const videoClips = [];
            const textClips = [];

            sentences.forEach((sentence, index) => {
                const duration = 6; // Each sentence stays for 6 seconds
                
                // Add Image Background (Using Unsplash keyword search)
                const keywords = sentence.split(' ').slice(0, 3).join(','); // Get first 3 words as keywords
                videoClips.push({
                    "asset": {
                        "type": "image",
                        "src": `https://images.unsplash.com/photo-1500622944204-b135684e99fd?q=80&w=1000&auto=format&fit=crop` // Placeholder, in real AI we'd fetch specific IDs
                    },
                    "start": currentTime,
                    "length": duration,
                    "effect": "zoomIn"
                });

                // Add Text Overlay
                textClips.push({
                    "asset": {
                        "type": "title",
                        "text": sentence.trim(),
                        "style": "subtitle",
                        "offset": { "y": -0.3 }
                    },
                    "start": currentTime,
                    "length": duration,
                    "transition": { "entry": "fade" }
                });

                currentTime += duration;
            });

            terminal.innerHTML += `<p>> Final Duration: ${currentTime} Seconds.</p>`;
            bar.style.width = "40%";

            // 3. SEND TO SHOTSTACK
            try {
                const response = await fetch('https://api.shotstack.io/stage/render', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': SHOTSTACK_API_KEY
                    },
                    body: JSON.stringify({
                        "timeline": {
                            "background": "#000000",
                            "tracks": [
                                { "clips": textClips },  // Text on top
                                { "clips": videoClips } // Images on bottom
                            ]
                        },
                        "output": { "format": "mp4", "resolution": "hd" }
                    })
                });

                const data = await response.json();
                
                if(data.success) {
                    terminal.innerHTML += `<p class="text-green-400">> SUCCESS: Render ID ${data.response.id}</p>`;
                    terminal.innerHTML += "<p>> Your visual documentary is being built...</p>";
                    bar.style.width = "100%";
                } else {
                    terminal.innerHTML += "<p class='text-red-500'>> Error: " + data.message + "</p>";
                }
            } catch (error) {
                terminal.innerHTML += "<p class='text-red-500'>> Connection failed.</p>";
            }
        }

        setInterval(() => {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
